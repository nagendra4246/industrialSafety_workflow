services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industrial_safety}
      POSTGRES_USER: ${POSTGRES_USER:-safety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safety_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-safety}:${POSTGRES_PASSWORD:-safety_local_only}@db:5432/${POSTGRES_DB:-industrial_safety}
    volumes:
      - ./data:/data
      - ./docs/data-dictionary.md:/app/docs/data-dictionary.md:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-18000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
